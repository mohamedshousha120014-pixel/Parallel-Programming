# =============================================
#  Spring Batch ETL - Configuration
# =============================================

# App
spring.application.name=spring-batch-etl

# ---- Database (H2 in-memory for demo) ----
spring.datasource.url=jdbc:h2:mem:etldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Spring Batch ----
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ---- Multi-Threading Configuration ----
# Core pool size (minimum threads always alive)
etl.thread-pool.core-size=4
# Max threads allowed
etl.thread-pool.max-size=10
# Queue capacity before rejecting
etl.thread-pool.queue-capacity=50
# Thread name prefix
etl.thread-pool.thread-name-prefix=ETL-Worker-

# ---- Batch Chunk Size ----
etl.chunk-size=5

# ---- Input CSV file ----
etl.input-file=classpath:data/employees.csv

# ---- Logging ----
logging.level.com.example.etl=DEBUG
logging.level.org.springframework.batch=INFO
